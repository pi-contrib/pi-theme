name: Validate themes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: curl -fsSL https://pi.dev/schemas/theme.schema.json -o /tmp/pi-theme-schema.json
      - run: npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s /tmp/pi-theme-schema.json -d 'themes/*.json'
      - run: npm pack --dry-run
