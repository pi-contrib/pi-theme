name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: curl -fsSL https://pi.dev/schemas/theme.schema.json -o /tmp/pi-theme-schema.json
      - run: >-
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false
          -s /tmp/pi-theme-schema.json -d 'themes/*.json'
      - run: npm pack --dry-run

  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/config/release-please-config.json
          manifest-file: .github/config/release-please-manifest.json
      - uses: actions/checkout@v7
        if: steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - uses: actions/setup-node@v6
        if: steps.release.outputs.release_created == 'true'
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm publish --ignore-scripts
        if: steps.release.outputs.release_created == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
